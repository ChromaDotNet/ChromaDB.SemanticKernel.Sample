# Ollama for the samples that run the models locally: docker compose up -d
# The samples start Chroma themselves: the concept samples on port 8000, the text search steps on a free port.
services:
  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Downloads the chat and embedding models into the ollama volume, then exits.
  ollama-models:
    image: ollama/ollama:0.35.1
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b && ollama pull nomic-embed-text"]

volumes:
  ollama:
