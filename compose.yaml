# Chroma and Ollama for the sample: docker compose up -d
services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      - chroma:/data

  ollama:
    image: ollama/ollama:0.35.1
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  # Downloads the chat and embedding models into the ollama volume, then exits.
  ollama-models:
    image: ollama/ollama:0.35.1
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b && ollama pull all-minilm"]

volumes:
  chroma:
  ollama:
