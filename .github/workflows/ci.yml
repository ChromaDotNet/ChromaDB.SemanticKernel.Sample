name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The samples are tests too, but they need the models. The tests run the scenario of each sample
      # without a model, against Chroma in a container started with Testcontainers on the Docker of the runner.
      - name: Test
        run: dotnet test test/ChromaDB.SemanticKernel.Sample.Tests
